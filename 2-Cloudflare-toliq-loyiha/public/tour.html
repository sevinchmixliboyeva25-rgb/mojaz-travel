<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sayohat — Mo'jaz</title>
  <meta name="description" content="Tur tafsilotlari, marshrut, sanalar va narxlar. Onlayn band qilish.">
  <meta name="theme-color" content="#0c3440">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main id="tourRoot"></main>

<!-- Booking modal -->
<div class="modal" id="bookModal" role="dialog" aria-modal="true" aria-labelledby="bkTitle">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-box">
    <div class="modal-head"><div><h3 id="bkTitle" data-i18n="bk_title"></h3><small id="bkTour"></small></div><button class="icon-btn" data-close id="bkClose" aria-label="close"></button></div>
    <div class="modal-body" id="bkBody"></div>
    <div class="modal-foot" id="bkFoot">
      <div class="sum"><small data-i18n="total"></small><b id="bkTotal">—</b></div>
      <div style="display:flex;gap:10px"><button class="btn btn-ghost" id="bkBack" style="color:var(--teal)" data-i18n="back"></button><button class="btn btn-primary" id="bkNext" data-i18n="next"></button></div>
    </div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/art.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/tour.js"></script>
</body>
</html>
